[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "claudexml"
version = "1.0.0"
description = "Pydantic-like XML parser for Claude's XML output"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "claudexml contributors" },
]
keywords = ["claude", "xml", "parser", "anthropic", "llm", "pydantic"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Text Processing :: Markup :: XML",
    "Typing :: Typed",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.20.0"]
pydantic = ["pydantic>=2.0"]
dev = [
    "pytest>=8.0",
    "ruff>=0.4.0",
    "mypy>=1.10",
]

[project.urls]
Homepage = "https://github.com/sieuchuoicb/claudexml"
Repository = "https://github.com/sieuchuoicb/claudexml"

[tool.hatch.build.targets.wheel]
packages = ["src/claudexml"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.mypy]
python_version = "3.10"
strict = true

[[tool.mypy.overrides]]
module = "pydantic.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "claudexml.pydantic_compat"
warn_unused_ignores = false

[tool.pytest.ini_options]
testpaths = ["tests"]
